<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  <rect width="1200" height="72" fill="#183b56"/>
  <text x="48" y="46" fill="#ffffff" font-size="26" font-family="Microsoft YaHei, SimHei">AI象棋对弈助手</text>
  <text x="1030" y="43" fill="#d7e8f2" font-size="16" font-family="Microsoft YaHei, SimHei">设置</text>
  <text x="60" y="142" fill="#183b56" font-size="34" font-family="Microsoft YaHei, SimHei">开始一局练习</text>
  <text x="60" y="181" fill="#5e6b73" font-size="18" font-family="Microsoft YaHei, SimHei">在本地完成摆局、对弈和复盘，棋谱默认保存在本机。</text>
  <rect x="60" y="230" width="330" height="160" rx="8" fill="#e3f1f7" stroke="#3f83a0" stroke-width="2"/>
  <text x="92" y="280" fill="#183b56" font-size="23" font-family="Microsoft YaHei, SimHei">开始新对弈</text>
  <text x="92" y="320" fill="#45616e" font-size="16" font-family="Microsoft YaHei, SimHei">选择执棋方与 AI 难度</text>
  <rect x="92" y="340" width="160" height="34" rx="4" fill="#2d7898"/>
  <text x="130" y="364" fill="#ffffff" font-size="16" font-family="Microsoft YaHei, SimHei">开始</text>
  <rect x="425" y="230" width="330" height="160" rx="8" fill="#ffffff" stroke="#ccd8df" stroke-width="2"/>
  <text x="457" y="280" fill="#183b56" font-size="23" font-family="Microsoft YaHei, SimHei">摆放局面</text>
  <text x="457" y="320" fill="#45616e" font-size="16" font-family="Microsoft YaHei, SimHei">导入或手动设置待分析局面</text>
  <rect x="457" y="340" width="160" height="34" rx="4" fill="#ffffff" stroke="#2d7898"/>
  <text x="491" y="364" fill="#2d7898" font-size="16" font-family="Microsoft YaHei, SimHei">进入摆局</text>
  <rect x="790" y="230" width="330" height="160" rx="8" fill="#ffffff" stroke="#ccd8df" stroke-width="2"/>
  <text x="822" y="280" fill="#183b56" font-size="23" font-family="Microsoft YaHei, SimHei">最近对局</text>
  <text x="822" y="320" fill="#45616e" font-size="16" font-family="Microsoft YaHei, SimHei">查看本地保存的练习记录</text>
  <rect x="822" y="340" width="160" height="34" rx="4" fill="#ffffff" stroke="#2d7898"/>
  <text x="856" y="364" fill="#2d7898" font-size="16" font-family="Microsoft YaHei, SimHei">查看记录</text>
  <text x="60" y="480" fill="#183b56" font-size="25" font-family="Microsoft YaHei, SimHei">最近使用</text>
  <rect x="60" y="510" width="1060" height="64" fill="#ffffff" stroke="#d7e0e5"/>
  <text x="85" y="550" fill="#263e4b" font-size="17" font-family="Microsoft YaHei, SimHei">2026-09-27 练习局 · 标准难度</text>
  <text x="850" y="550" fill="#2d7898" font-size="17" font-family="Microsoft YaHei, SimHei">打开复盘 →</text>
  <text x="60" y="690" fill="#6d7b83" font-size="16" font-family="Microsoft YaHei, SimHei">空数据状态：首次使用时显示“还没有保存的对局”，并提供“开始新对弈”按钮。</text>
</svg>
