<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  <rect width="1200" height="66" fill="#183b56"/>
  <text x="38" y="43" fill="#ffffff" font-size="24" font-family="Microsoft YaHei, SimHei">AI象棋对弈助手</text>
  <text x="45" y="112" fill="#183b56" font-size="27" font-family="Microsoft YaHei, SimHei">对局复盘</text>
  <text x="45" y="145" fill="#63737c" font-size="15" font-family="Microsoft YaHei, SimHei">2026-09-27 · 红方 · 标准难度 · 共 18 个半回合</text>
  <rect x="45" y="185" width="360" height="430" fill="#ffffff" stroke="#ccd8df"/>
  <text x="75" y="228" fill="#183b56" font-size="21" font-family="Microsoft YaHei, SimHei">关键节点</text>
  <rect x="75" y="258" width="300" height="78" fill="#fff2e8" stroke="#d78b54"/>
  <text x="95" y="288" fill="#a75525" font-size="17" font-family="Microsoft YaHei, SimHei">第 6 回合 · 漏防</text>
  <text x="95" y="316" fill="#63737c" font-size="14" font-family="Microsoft YaHei, SimHei">评价下降 0.82 → -0.20</text>
  <rect x="75" y="354" width="300" height="78" fill="#eef6f2" stroke="#6da48a"/>
  <text x="95" y="384" fill="#347457" font-size="17" font-family="Microsoft YaHei, SimHei">第 9 回合 · 子力损失</text>
  <text x="95" y="412" fill="#63737c" font-size="14" font-family="Microsoft YaHei, SimHei">评价下降 0.10 → -0.45</text>
  <rect x="75" y="450" width="300" height="78" fill="#eef3fa" stroke="#7f9fc7"/>
  <text x="95" y="480" fill="#3e6094" font-size="17" font-family="Microsoft YaHei, SimHei">第 13 回合 · 多解</text>
  <text x="95" y="508" fill="#63737c" font-size="14" font-family="Microsoft YaHei, SimHei">需要人工确认，不判定唯一答案</text>
  <rect x="445" y="185" width="710" height="190" fill="#ffffff" stroke="#ccd8df"/>
  <text x="475" y="228" fill="#183b56" font-size="21" font-family="Microsoft YaHei, SimHei">节点详情：第 6 回合</text>
  <text x="475" y="270" fill="#263e4b" font-size="17" font-family="Microsoft YaHei, SimHei">你的着法：车二进三　　　推荐：马八进七</text>
  <text x="475" y="307" fill="#263e4b" font-size="17" font-family="Microsoft YaHei, SimHei">原因：未处理被攻击的右马，黑方获得连续先手。</text>
  <text x="475" y="344" fill="#63737c" font-size="15" font-family="Microsoft YaHei, SimHei">主变化：马八进七　炮八平五　车一平二</text>
  <rect x="445" y="405" width="710" height="210" fill="#eaf4f7" stroke="#8db7c8"/>
  <text x="475" y="448" fill="#183b56" font-size="21" font-family="Microsoft YaHei, SimHei">下一次练习建议</text>
  <text x="475" y="491" fill="#45616e" font-size="17" font-family="Microsoft YaHei, SimHei">1. 练习“先处理被攻击子力”的中局局面。</text>
  <text x="475" y="530" fill="#45616e" font-size="17" font-family="Microsoft YaHei, SimHei">2. 每步落子前检查对方的将军和直接攻击。</text>
  <text x="475" y="569" fill="#45616e" font-size="17" font-family="Microsoft YaHei, SimHei">3. 对多解节点保留两个候选着法，交由人工复核。</text>
  <rect x="445" y="665" width="150" height="40" rx="4" fill="#2d7898"/><text x="483" y="691" fill="#fff" font-size="16" font-family="Microsoft YaHei, SimHei">再次练习</text>
  <rect x="615" y="665" width="150" height="40" rx="4" fill="#fff" stroke="#2d7898"/><text x="655" y="691" fill="#2d7898" font-size="16" font-family="Microsoft YaHei, SimHei">导出摘要</text>
